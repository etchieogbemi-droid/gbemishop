<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Store</title><link rel="icon" href="images/logo.svg">
<style>
:root{--b:#1e4fd8;--p:#ec4899;--bg:#f5f7ff;--t:#1b2240}*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--b);color:#fff;position:sticky;top:0;z-index:5;flex-wrap:wrap}header img{height:40px;border:2px solid #fff;border-radius:10px}header b{flex:1;font-size:20px}
button{background:var(--p);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}button.b{background:var(--b)}button.g{background:#e5e8f5;color:var(--t)}button:disabled{opacity:.5}
.hero{min-height:380px;background:linear-gradient(rgba(30,79,216,.55),rgba(236,72,153,.45)),url(images/hero.jpg) center/cover,var(--b);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}.hero h1{font-size:clamp(28px,6vw,52px);margin:0 0 8px}
main{max-width:1000px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px #1e4fd822}.card img{width:100%;height:150px;object-fit:cover;border-radius:8px}
input,textarea{width:100%;padding:9px;margin:4px 0 10px;border:1px solid #c9d1f0;border-radius:8px;font:inherit}
.tag{background:var(--p);color:#fff;border-radius:99px;padding:2px 10px;font-size:13px}.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.chat{max-height:240px;overflow:auto;background:#eef1ff;padding:8px;border-radius:8px}.m{margin:4px 0}.m.me{text-align:right}.m span{display:inline-block;padding:5px 10px;border-radius:12px;background:#fff}.m.me span{background:var(--b);color:#fff}
</style></head><body>
<header><img src="images/logo.svg" alt="logo"><b onclick="go('shop')" style="cursor:pointer">My Store</b><span id="nav"></span></header><div id="app"></div>
<script>
const SHOP='My Store',CUR='₦',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),money=n=>CUR+Number(n).toLocaleString(),dt=d=>new Date(d).toLocaleString();
const ST=['Fresh order – awaiting payment','Payment received','Processing','On its way (arrives in 3 days)','Ready for pickup','Completed'],NX=['Payment received','Processing','On its way','Send pickup details','Completed'];
let T=localStorage.t||'',U=JSON.parse(localStorage.u||'null'),view='shop',tab='req',P=[],R=[],reg=false;
const api=async(p,m='GET',b)=>{const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:T},body:b&&JSON.stringify(b)});const j=await r.json();if(!r.ok){alert(j.error||'Error');throw j.error}return j};
const go=v=>{view=v;render()},home=()=>go(U.role=='admin'?'admin':'me');
function render(){$('#nav').innerHTML=U?`<button class=g onclick="home()">${U.role=='admin'?'Admin':'My Account'}</button> <button class=g onclick="out()">Logout</button>`:`<button class=g onclick="go('auth')">Login / Sign up</button>`;({shop,auth:authv,me,admin})[view]()}
function out(){T='';U=null;localStorage.clear();go('shop')}
async function shop(){P=await api('products');$('#app').innerHTML=`<div class=hero><h1>Welcome to ${SHOP}</h1><p>Quality products, delivered to you</p><button onclick="pl.scrollIntoView()">Shop now</button></div><main><div class=grid id=pl>${P.map(p=>`<div class=card><div style="display:flex;gap:4px">${p.images.slice(0,2).map(i=>`<img src="${i}" style="height:110px">`).join('')}</div><h3>${esc(p.name)} <small>${p.code}</small></h3><p>${esc(p.desc)}</p><b>${money(p.price)}</b> · ${p.stock>0?p.stock+' available':'Out of stock'}<br><br><button ${p.stock>0?'':'disabled'} onclick="want(${p.id})">Request</button></div>`).join('')||'<p>No products yet.</p>'}</div></main>`}
async function want(id){if(!U)return go('auth');const q=prompt('Quantity?','1');if(!q)return;await api('requests','POST',{productId:id,qty:+q});alert('Request sent! Payment details will appear in your account.');go('me')}
function authv(){$('#app').innerHTML=`<main style="max-width:420px"><div class=card><h2>${reg?'Create account':'Login'}</h2>${reg?'<input id=n placeholder="Full name"><input id=ph placeholder="Phone number"><input id=lo placeholder="Location / address">':''}<input id=e type=email placeholder=Email><input id=pw type=password placeholder=Password><button class=b onclick="sub()">${reg?'Sign up':'Login'}</button> <button class=g onclick="reg=!reg;authv()">${reg?'I have an account':'New here? Sign up'}</button></div></main>`}
async function sub(){const b={email:$('#e').value,pass:$('#pw').value};if(reg)Object.assign(b,{name:$('#n').value,phone:$('#ph').value,location:$('#lo').value});const j=await api(reg?'register':'login','POST',b);T=j.token;U=j.user;localStorage.t=T;localStorage.u=JSON.stringify(U);home()}
const hist=x=>x.history.map(h=>`${ST[h.s]}: ${dt(h.d)}`).join('<br>'),info=x=>`${x.acct&&x.status==0?`<p><b>Pay to:</b> ${esc(x.acct)}</p>`:''}${x.status==3?`<p>Expected by ${dt(x.eta)}</p>`:''}${x.status>=4&&x.note?`<p><b>Pickup:</b> ${esc(x.note)}</p>`:''}`;
async function me(){R=await api('requests');$('#app').innerHTML=`<main><div class=card><h2>${esc(U.name)}</h2>${esc(U.email)} · ${esc(U.phone)} · ${esc(U.location)}</div><h3>My orders</h3>${R.map(x=>`<div class=card style="margin-bottom:10px"><b>${esc(x.pname)}</b> (${x.code}) × ${x.qty} = ${money(x.total)}<br><span class=tag>${x.status+1}/6 ${ST[x.status]}</span>${info(x)}<small><br>${hist(x)}</small></div>`).join('')||'<p>No orders yet.</p>'}<h3>Chat with store</h3><div id=cbox></div></main>`;chat()}
async function chat(uid){const m=await api('chat'+(uid?'/'+uid:''));$('#cbox').innerHTML=`<div class=chat>${m.map(x=>`<div class="m ${x.from==U.role?'me':''}"><span>${esc(x.text)}</span></div>`).join('')||'No messages yet'}</div><input id=ct placeholder="Type a message"><button class=b onclick="send(${uid||0})">Send</button>`}
async function send(u){const t=$('#ct').value.trim();if(t){await api('chat'+(u?'/'+u:''),'POST',{text:t});chat(u)}}
async function admin(){if(!U||U.role!='admin')return go('auth');[R,P]=await Promise.all([api('requests'),api('products')]);$('#app').innerHTML=`<main><div class=tabs>${[['req','Customer requests'],['prod','Products'],['cus','Customers']].map(([k,l])=>`<button class="${tab==k?'b':'g'}" onclick="tab='${k}';admin()">${l}</button>`).join('')}</div><div id=tb></div></main>`;({req:reqs,prod:prods,cus})[tab]()}
function reqs(){$('#tb').innerHTML=`<button class=b onclick="prn()">🖨 Print selected receipts</button> <button class=g onclick="document.querySelectorAll('.pk').forEach(c=>c.checked=true)">Select all</button>`+(R.map(x=>`<div class=card style="margin:10px 0"><input type=checkbox class=pk value=${x.id} style="width:auto"> <b>#${x.id} ${esc(x.pname)}</b> (${x.code}) × ${x.qty} = ${money(x.total)}<br>${esc(x.user.name)} · ${esc(x.user.phone)} · ${esc(x.user.location)}<br><span class=tag>${ST[x.status]}</span>${x.acct&&x.status==0?' <small>(account details sent)</small>':''}${info(x)}<br><small>${hist(x)}</small><br><br>${x.status==0?`<button class=b onclick="adv(${x.id},'acct')">Send account details</button> `:''}${x.status<5?`<button onclick="adv(${x.id},${x.status+1})">${NX[x.status]}</button>`:''}</div>`).join('')||'<p>No requests yet.</p>')}
async function adv(id,s){let b={};if(s=='acct'){const a=prompt('Account details to send (bank, account number, name):',localStorage.acct||'');if(!a)return;localStorage.acct=a;b={acct:a}}else{b={status:s};if(s==4){const a=prompt('Pickup station and phone number:');if(!a)return;b.note=a}}await api('requests/'+id,'PUT',b);admin()}
function prn(){const ids=[...document.querySelectorAll('.pk:checked')].map(x=>+x.value);if(!ids.length)return alert('Tick the requests to print first');const w=open('');w.document.write('<style>body{font:14px sans-serif}.r{border:1px dashed #000;padding:12px;margin:8px;width:46%;display:inline-block;vertical-align:top;page-break-inside:avoid}</style>'+R.filter(r=>ids.includes(r.id)).map(r=>`<div class=r><h3>${SHOP} – Receipt #${r.id}</h3>Date: ${dt(r.history[0].d)}<br>Customer: ${esc(r.user.name)}<br>Phone: ${esc(r.user.phone)}<br>Location: ${esc(r.user.location)}<hr>Product: ${esc(r.pname)}<br>Code: ${r.code}<br>Quantity: ${r.qty}<br><b>Amount: ${money(r.total)}</b></div>`).join(''));w.document.close();w.print()}
const rs=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1000/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};i.src=URL.createObjectURL(f)});
function prods(){$('#tb').innerHTML=`<div class=card><h3>Add product</h3><input id=pn placeholder="Product name"><input id=pp type=number placeholder="Price"><input id=ps type=number placeholder="Quantity available"><textarea id=pd placeholder=Description></textarea>Pictures (at least 2):<input id=pi type=file accept="image/*" multiple><button class=b onclick="addP()">Upload product</button></div><div class=grid style="margin-top:10px">${P.map(p=>`<div class=card><img src="${p.images[0]}"><b>${esc(p.name)}</b> ${p.code}<br>${money(p.price)} · stock ${p.stock}<br><small>Added ${dt(p.created)}</small><br><br><button class=b onclick="stk(${p.id})">Edit stock</button> <button class=g onclick="del(${p.id})">Delete</button></div>`).join('')}</div>`}
async function addP(){const f=[...$('#pi').files];if(f.length<2)return alert('Upload at least 2 pictures');const images=[];for(const x of f)images.push((await api('upload','POST',{data:await rs(x)})).url);await api('products','POST',{name:$('#pn').value,price:+$('#pp').value,stock:+$('#ps').value,desc:$('#pd').value,images});admin()}
async function stk(id){const s=prompt('New quantity available:');if(s!==null&&s!==''){await api('products/'+id,'PUT',{stock:+s});admin()}}
async function del(id){if(confirm('Delete this product?')){await api('products/'+id,'DELETE');admin()}}
function cus(){$('#tb').innerHTML=`<input id=sq placeholder="Search name, email, phone or location" oninput="find()"><div id=cl></div><div id=cbox></div>`;find()}
async function find(){const c=await api('customers?q='+encodeURIComponent($('#sq').value));$('#cl').innerHTML=c.map(u=>`<div class=card style="margin:6px 0"><b>${esc(u.name)}</b> · ${esc(u.email)} · ${esc(u.phone)} · ${esc(u.location)} · ${u.orders} orders <button class=b onclick="chat(${u.id})">Chat</button></div>`).join('')||'No customers found'}
render();
</script></body></html>
